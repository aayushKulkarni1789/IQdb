[project]
name = "app"
version = "0.1.0"
description = "Backend package of IMGDB project"

requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.3",
    "pgvector>=0.4.2",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.38",
    "tenacity>=9.1.4",
]

[project.scripts]
app = "app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
model-setup = [
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "transformers>=5.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
